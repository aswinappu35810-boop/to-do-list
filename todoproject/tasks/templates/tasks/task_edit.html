<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit task</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 px-4 py-10 text-slate-800">
    <main class="mx-auto max-w-xl rounded-3xl bg-white p-6 shadow-xl shadow-slate-200/70 sm:p-8">
        <p class="text-sm font-bold uppercase tracking-widest text-violet-500">Make a tweak</p>
        <h1 class="mt-1 text-3xl font-black text-slate-900">Edit task</h1>
        <form method="post" class="mt-6 space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="flex flex-wrap gap-3 pt-2">
                <button type="submit" class="rounded-xl bg-violet-600 px-4 py-3 font-bold text-white hover:bg-violet-700">Save changes</button>
                <a href="{% url 'task_list' %}" class="rounded-xl bg-slate-200 px-4 py-3 font-bold text-slate-700 hover:bg-slate-300">Back to list</a>
            </div>
        </form>
    </main>
    <style>
        form p { margin: 0; }
        form input, form textarea, form select {
            width: 100%; margin-top: 0.35rem; border: 1px solid #cbd5e1;
            border-radius: 0.75rem; background: white; padding: 0.65rem 0.75rem; color: #0f172a;
        }
        form textarea { min-height: 5rem; resize: vertical; }
    </style>
</body>
</html>
