<!DOCTYPE html>
<html lang="en">
<head>
    <title>Delete task</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 px-4 py-10 text-slate-800">
    <main class="mx-auto max-w-md rounded-3xl bg-white p-6 text-center shadow-xl shadow-slate-200/70 sm:p-8">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-rose-100 text-2xl">🗑️</div>
        <h1 class="mt-4 text-3xl font-black text-slate-900">Delete this task?</h1>
        <p class="mt-3 break-words text-slate-500">Are you sure you want to delete <strong class="text-slate-700">"{{ task.title }}"</strong>?</p>
        <form method="post" class="mt-6 flex flex-wrap justify-center gap-3">
            {% csrf_token %}
            <button type="submit" class="rounded-xl bg-rose-600 px-4 py-3 font-bold text-white hover:bg-rose-700">Yes, delete</button>
            <a href="{% url 'task_list' %}" class="rounded-xl bg-slate-200 px-4 py-3 font-bold text-slate-700 hover:bg-slate-300">Cancel</a>
        </form>
    </main>
</body>
</html>
