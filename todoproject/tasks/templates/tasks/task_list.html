<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
</head>
<body>
    <h1>My To-Do List</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add task</button>
    </form>

    {% for task in tasks %}
        <p>
            {% if task.is_completed %}✅{% else %}⬜{% endif %}
            {{ task.title }}
            <a href="{% url 'task_edit' task.pk %}">Edit</a>
            <a href="{% url 'task_delete' task.pk %}">Delete</a>
        </p>
    {% empty %}
        <p>No tasks yet.</p>
    {% endfor %}
</body>
</html>
