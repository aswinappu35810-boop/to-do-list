<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
</head>
<body>
    <h1>My To-Do List</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add task</button>
    </form>

    {% for task in tasks %}
        <p>
            {% if task.is_completed %}✅{% else %}⬜{% endif %}
            {{ task.title }}
            <a href="{% url 'task_edit' task.pk %}">Edit</a>
            <a href="{% url 'task_delete' task.pk %}">Delete</a>
        </p>
        <form method="post" action="{% url 'task_toggle' task.pk %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit">
                {% if task.is_completed %}Undo{% else %}Done{% endif %}
            </button>
        </form>
    {% empty %}
        <p>No tasks yet.</p>
    {% endfor %}
    <h2>Progress</h2>
    <p>Done: {{ done_count }} | Not done: {{ pending_count }}</p>
    <div style="width: 300px;">
        <canvas id="progressChart"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const ctx = document.getElementById('progressChart');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Done', 'Not done'],
                datasets: [{
                    data: [{{ done_count }}, {{ pending_count }}],
                    backgroundColor: ['#22c55e', '#d1d5db'],
                }]
            }
        });
    </script>
</body>
</html>
